spring:
  application:
    name: newzic-be

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newzic}
    username: ${DB_USERNAME:newzic}
    password: ${DB_PASSWORD:newzic}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        ssl: ${DB_SSL:false}
        sslmode: ${DB_SSLMODE:prefer}
        sslfactory: ${DB_SSLFACTORY:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB
  error:
    include-message: always
    include-stacktrace: always

logging:
  level:
    com.newzic: DEBUG
    org.springframework.web: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:newzic-dev-secret-key-change-in-production-minimum-256-bits-long}
    expiration-ms: 86400000 # 24h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
