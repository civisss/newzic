@if (player.currentSong()) {
  <div class="player">
    <div class="player-inner">
      <!-- Track Info -->
      <div class="player-track">
        <img [src]="player.currentSong()!.cover" [alt]="player.currentSong()!.title" class="track-cover" />
        <div class="track-info">
          <span class="track-title">{{ player.currentSong()!.title }}</span>
          <a [routerLink]="'/artist/' + player.currentSong()!.artistId" class="track-artist">{{ player.currentSong()!.artistName }}</a>
        </div>
        <button class="like-btn" aria-label="Like">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

      <!-- Controls -->
      <div class="player-controls">
        <div class="control-buttons">
          <button class="ctrl-btn" [class.active]="player.shuffle()" (click)="player.toggleShuffle()" aria-label="Shuffle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
              <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
              <line x1="4" y1="4" x2="9" y2="9"/>
            </svg>
          </button>
          <button class="ctrl-btn" (click)="player.previous()" aria-label="Previous">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="play-btn" (click)="player.togglePlay()" aria-label="Play/Pause">
            @if (player.isPlaying()) {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
            } @else {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            }
          </button>
          <button class="ctrl-btn" (click)="player.next()" aria-label="Next">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button class="ctrl-btn" [class.active]="player.repeat() !== 'off'" (click)="player.toggleRepeat()" aria-label="Repeat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
            @if (player.repeat() === 'one') {
              <span class="repeat-one">1</span>
            }
          </button>
        </div>

        <div class="progress-row">
          <span class="time">{{ player.currentTimeFormatted() }}</span>
          <div class="progress-bar" (click)="onProgressClick($event)">
            <div class="progress-fill" [style.width.%]="player.progressPercent()">
              <div class="progress-knob"></div>
            </div>
          </div>
          <span class="time">{{ player.durationFormatted() }}</span>
        </div>
      </div>

      <!-- Volume -->
      <div class="player-volume">
        <button class="ctrl-btn" aria-label="Volume">
          @if (player.volume() === 0) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          }
        </button>
        <div class="volume-bar" (click)="onVolumeClick($event)">
          <div class="volume-fill" [style.width.%]="player.volume()"></div>
        </div>
      </div>
    </div>
  </div>
}
